version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/starter-2025:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONGO_HOST: db
      MONGO_PORT: 27017

  db:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ../setup_beasts.js:/docker-entrypoint-initdb.d/01-setup_beasts.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"const ok = db.adminCommand({ ping: 1 }).ok; if (ok !== 1) { throw new Error('MongoDB ping failed in container healthcheck'); }\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb-data:
